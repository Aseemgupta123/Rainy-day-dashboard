<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Trumps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark}
html,body{margin:0}
img{max-width:100%}

:root{
  --abyss:#0C1216;
  --slate:#161F26;
  --slate-2:#1E2A33;
  --slate-3:#27353F;
  --line:#33444F;
  --bone:#EAE4D6;
  --ash:#8FA0AB;
  --ash-dim:#61727D;
  --iris:#F0A81E;
  --iris-deep:#8A5F0C;
  --teal:#4FB3A8;
  --teal-deep:#1F5C57;
  --moss:#7FB069;
  --rust:#C4574A;
  --shadow:0 18px 44px -18px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1100px 620px at 50% -14%, #1D2B34 0%, rgba(29,43,52,0) 62%),
    var(--abyss);
  color:var(--bone);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--iris);outline-offset:3px}

.wrap{max-width:1420px;margin:0 auto;padding:22px 20px 56px}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.mast h1{
  font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:34px;line-height:1;
  margin:0;letter-spacing:-.01em;
}
.mast h1 em{font-style:normal;color:var(--iris)}
.mast .sub{font-size:12px;color:var(--ash-dim);letter-spacing:.14em;text-transform:uppercase;margin-top:7px}
.mast .meta{display:flex;gap:22px;align-items:flex-end}
.meta-cell{text-align:right}
.meta-cell .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash-dim)}
.meta-cell .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-variant-numeric:tabular-nums;color:var(--bone)}

/* ---------- menu ---------- */
.menu{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:start;margin-top:14px}
@media(max-width:820px){.menu{grid-template-columns:1fr}}
.menu-lede{font-family:"Fraunces",Georgia,serif;font-size:26px;line-height:1.3;margin:0 0 14px;max-width:22ch;text-wrap:balance}
.menu p{color:var(--ash);max-width:62ch;margin:0 0 16px}
.rules{list-style:none;padding:0;margin:20px 0 0;border-top:1px solid var(--line)}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:var(--ash);font-size:14px}
.rules .n{font-family:"IBM Plex Mono",monospace;color:var(--iris);font-size:12px;padding-top:2px}
.rules b{color:var(--bone);font-weight:500}

.modes{display:flex;flex-direction:column;gap:12px}
.mode{
  display:block;width:100%;text-align:left;padding:16px 18px;
  background:var(--slate);border:1px solid var(--line);border-radius:3px;
  transition:border-color .16s,background .16s,transform .16s;
}
.mode:hover{border-color:var(--iris);background:var(--slate-2);transform:translateY(-1px)}
.mode .t{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600}
.mode .d{color:var(--ash);font-size:13px;margin-top:3px}
.mode .go{float:right;color:var(--iris);font-family:"IBM Plex Mono",monospace;font-size:13px}

.legend{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.legend h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash-dim);margin:0 0 10px;font-weight:600}
.legend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px}
.legend-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ash);
  border-bottom:1px dotted var(--line);padding-bottom:5px}
.legend-row span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--ash-dim);white-space:nowrap}

/* ---------- table (play area) ---------- */
.table{display:grid;grid-template-columns:170px 1fr 170px;gap:20px;align-items:start}
@media(max-width:900px){.table{grid-template-columns:1fr;gap:14px}}

.railcol{display:flex;flex-direction:column;gap:16px}

.rail{background:var(--slate);border:1px solid var(--line);border-radius:3px;padding:14px}
.rail.p2{border-color:var(--line)}
.rail.active{border-color:var(--iris);box-shadow:inset 3px 0 0 var(--iris)}
.rail.p2.active{box-shadow:inset -3px 0 0 var(--teal);border-color:var(--teal)}
.rail .who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash-dim)}
.rail .nm{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;margin-top:2px}
.rail.p1 .nm{color:var(--iris)}
.rail.p2 .nm{color:var(--teal)}
.rail .count{font-family:"IBM Plex Mono",monospace;font-size:36px;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.rail .cl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash-dim);margin-top:2px}
.stack{display:flex;flex-wrap:wrap;gap:2px;margin-top:12px}
.tick{width:7px;height:14px;background:var(--slate-3);border-radius:1px}
.rail.p1 .tick.on{background:var(--iris)}
.rail.p2 .tick.on{background:var(--teal)}
.turnflag{margin-top:12px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash-dim)}
.rail.active .turnflag{color:var(--bone)}

.arena{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.arena{grid-template-columns:1fr}}

/* ---------- card ---------- */
.card{
  background:linear-gradient(180deg,var(--slate-2) 0%,var(--slate) 46%);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.card.p1{border-top:3px solid var(--iris)}
.card.p2{border-top:3px solid var(--teal)}
.card.won{animation:card-lift 2.6s both;
  box-shadow:0 0 0 2px var(--moss),0 26px 52px -18px rgba(127,176,105,.5),var(--shadow)}
@keyframes card-lift{
  0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  20%{transform:translateY(-18px) scale(1.02);animation-timing-function:cubic-bezier(.45,0,.25,1)}
  100%{transform:none}
}
.plate .ribbon{position:absolute;top:26px;right:-44px;width:170px;z-index:2;transform:rotate(45deg);
  background:var(--moss);color:#132010;text-align:center;padding:6px 0;
  font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;
  box-shadow:0 4px 14px rgba(0,0,0,.45);animation:ribbon-in .6s ease-out .5s both}
@keyframes ribbon-in{from{opacity:0;transform:rotate(45deg) translateY(-18px)}to{opacity:1;transform:rotate(45deg)}}
.card-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.card-owner{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash-dim);display:flex;justify-content:space-between}
.card.p1 .card-owner b{color:var(--iris);font-weight:500}
.card.p2 .card-owner b{color:var(--teal);font-weight:500}
.card-name{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:700;line-height:1.12;margin-top:6px;text-wrap:balance}
.card-sci{font-style:italic;color:var(--ash);font-size:13px;margin-top:2px}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;padding:2px 7px;border:1px solid var(--line);border-radius:2px;color:var(--ash)}
.chip.iucn{border-color:currentColor}
.iucn-LC{color:var(--moss)}.iucn-NT{color:#B9B056}.iucn-VU{color:var(--iris)}
.iucn-EN{color:#D9814B}.iucn-CR{color:var(--rust)}
.chip.kind{border-color:currentColor}
.kind-p{color:var(--iris)}.kind-d{color:var(--teal)}.kind-m{color:#C3CBD2}
.kind-a{color:var(--moss)}.kind-c{color:var(--rust)}.kind-k{color:#B39DDB}

.plate{
  position:relative;background:
    radial-gradient(1px 1px at 12px 18px, rgba(255,255,255,.75) 50%, transparent 51%) 0 0/71px 83px,
    radial-gradient(1px 1px at 44px 61px, rgba(255,255,255,.45) 50%, transparent 51%) 0 0/97px 67px,
    radial-gradient(1.4px 1.4px at 77px 29px, rgba(255,255,255,.30) 50%, transparent 51%) 0 0/131px 109px,
    radial-gradient(120% 90% at 50% 15%, #0B1622 0%, #03060A 75%);
  border-bottom:1px solid var(--line);
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.plate svg{width:82%;height:82%;color:var(--bone);opacity:.92}
.plate img{width:100%;height:100%;object-fit:contain;object-position:center 40%;display:block;
  filter:saturate(.92) contrast(1.03);opacity:0}
.plate img.loaded{opacity:1;transition:opacity .25s}
.plate .platetag{position:absolute;left:10px;bottom:8px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.1em;color:var(--ash-dim);text-transform:uppercase;
  background:rgba(12,18,22,.55);padding:2px 6px;border-radius:2px;backdrop-filter:blur(2px)}

.stats{list-style:none;margin:0;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.statrow{
  display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:center;
  width:100%;text-align:left;padding:7px 8px;border-radius:3px;border:1px solid transparent;
  transition:background .13s,border-color .13s;position:relative;
}
.statrow .key{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ash-dim)}
.statrow .lab{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ash)}
.statrow .val{font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums;color:var(--bone)}
.statrow .val u{text-decoration:none;font-size:10px;color:var(--ash-dim);margin-left:3px}
button.statrow{cursor:pointer}
button.statrow:hover{background:var(--slate-3);border-color:var(--line)}
button.statrow:hover .lab{color:var(--bone)}
.statrow.picked{background:rgba(240,168,30,.10);border-color:var(--iris)}
.card.p2 .statrow.picked{background:rgba(79,179,168,.10);border-color:var(--teal)}
.statrow.picked .lab{color:var(--bone)}
.statrow.win .val{color:var(--moss)}
.statrow.lose .val{color:var(--rust)}

/* card back */
.card.back{align-items:stretch;justify-content:center;background:var(--slate);position:relative;min-height:420px}
.backfill{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(-135deg,rgba(255,255,255,.028) 0 2px,transparent 2px 11px),
    var(--slate);
  margin:9px;border:1px solid var(--line);border-radius:2px;
}
.backfill .emblem{width:72px;height:72px;color:var(--teal);opacity:.75}
.backfill .bt{font-family:"Fraunces",Georgia,serif;font-size:16px;color:var(--ash)}
.backfill .bs{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash-dim)}

/* ---------- prompt / verdict ---------- */
.prompt{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--slate);border:1px solid var(--line);border-left:3px solid var(--iris);
  border-radius:3px;padding:12px 16px;
}
.prompt.teal{border-left-color:var(--teal)}
.prompt.win{border-left-color:var(--moss)}
.prompt.lose{border-left-color:var(--rust)}
.prompt.draw{border-left-color:var(--ash)}
.prompt .msg{font-family:"Fraunces",Georgia,serif;font-size:18px;line-height:1.3}
.prompt .hint{font-size:12px;color:var(--ash-dim);margin-top:2px}
.prompt .msg b{color:var(--iris);font-weight:700}
.prompt .msg b.t{color:var(--teal)}
.btn{
  background:var(--iris);color:#14100A;font-weight:600;font-size:14px;
  padding:10px 20px;border-radius:3px;letter-spacing:.02em;white-space:nowrap;
  transition:filter .15s,transform .15s;
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ash)}
.btn.ghost:hover{color:var(--bone);border-color:var(--ash)}

.pot{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--iris);letter-spacing:.08em;text-transform:uppercase}

/* ---------- log ---------- */
.log{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.log h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash-dim);margin:0 0 8px;font-weight:600}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;max-height:168px;overflow-y:auto}
.log li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;font-size:12.5px;color:var(--ash);
  padding:6px 2px;border-bottom:1px solid rgba(51,68,79,.5)}
.log .r{font-family:"IBM Plex Mono",monospace;color:var(--ash-dim);font-size:11px}
.log .o{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.log .o.a{color:var(--iris)}.log .o.b{color:var(--teal)}.log .o.d{color:var(--ash-dim)}
.log em{font-style:italic;color:var(--bone)}

/* ---------- game over ---------- */
.over{text-align:center;padding:46px 20px;background:var(--slate);border:1px solid var(--line);border-radius:4px}
.over .crest{width:120px;height:120px;margin:0 auto 12px;color:var(--iris)}
.over h2{font-family:"Fraunces",Georgia,serif;font-size:38px;margin:0 0 6px;line-height:1.1}
.over p{color:var(--ash);margin:0 0 22px}
.over .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <main id="app"></main>
</div>

  {n:"Bennu",        s:"A rubble pile; a probe brought a piece home in 2023",k:"Asteroid",    c:"a", o:"the Sun", a:"lumpy",  dm:0.49,   gr:0.00006, tp:-15,  dy:4.3,   mn:0,   ds:168,   img:"bennu.webp"},
  {n:"Ida",          s:"The first asteroid found to have its own moon",      k:"Asteroid",    c:"a", o:"the Sun", a:"lumpy",  dm:31,     gr:0.03,    tp:-113, dy:4.6,   mn:1,   ds:428,   img:"ida.webp"},
  {n:"Halley's Comet",s:"Comes back every 75 years — next in 2061",          k:"Comet",       c:"c", o:"the Sun", a:"comet",  dm:11,     gr:0.005,   tp:-205, dy:53,    mn:0,   ds:2667,  img:"halleys-comet.webp"},
  {n:"Comet 67P",    s:"A rubber-duck comet that a lander touched down on",  k:"Comet",       c:"c", o:"the Sun", a:"comet",  dm:4.1,    gr:0.001,   tp:-125, dy:12.4,  mn:0,   ds:518,   img:"comet-67p.webp"},
  {n:"Arrokoth",     s:"Two lumps stuck together, and the furthest place we have visited", k:"Kuiper belt", c:"k", o:"the Sun", a:"lumpy", dm:36, gr:0.006, tp:-233, dy:15.9, mn:0, ds:6670, img:"arrokoth.webp"}
];

const IMG_DIR = "images/space/";

const STATS = [
  {k:"dm", label:"Diameter",    unit:"km",      fmt:v=> v<10 ? +v.toFixed(2) : Math.round(v)},
  {k:"gr", label:"Gravity",     unit:"% Earth", fmt:v=> v>=1 ? +v.toFixed(1) : +v.toPrecision(1)},
  {k:"tp", label:"Temperature", unit:"°C",      fmt:v=> String(v).replace("-","−")},
  {k:"dy", label:"Day Length",  unit:"hrs",     fmt:v=> v<100 ? +v.toFixed(1) : Math.round(v)},
  {k:"mn", label:"Moons",       unit:"moons",   fmt:v=>v},
  {k:"ds", label:"Distance",    unit:"M km",    fmt:v=> v<1000 ? +v.toFixed(1) : Math.round(v)}
];

/* ============================================================
   SILHOUETTES — by body shape. Fallback plate art if a photo
   fails to load.
   ============================================================ */
const SPACE = {
round:
 `<circle cx="120" cy="66" r="48"/>`,

ringed:
 `<path fill-rule="evenodd" d="M24 66A96 20 0 1 0 216 66A96 20 0 1 0 24 66ZM46 66A74 11 0 1 1 194 66A74 11 0 1 1 46 66Z"/>`+
 `<circle cx="120" cy="66" r="34"/>`,

lumpy:
 `<path d="M62 70C56 53 68 36 88 30C107 24 130 26 149 34C170 42 185 55 187 70C189 85 175 99 156 105C133 112 106 111 85 101C70 94 63 84 62 70Z"/>`,

comet:
 `<path d="M152 66C148 53 157 41 172 39C188 37 200 48 200 62C200 76 190 87 174 87C160 87 154 79 152 66Z"/>`+
 `<path d="M152 56C122 50 82 42 38 32C30 30 30 24 38 25C84 31 126 40 154 48Z"/>`+
 `<path d="M152 78C122 84 82 94 38 104C30 106 30 112 38 111C84 105 126 96 154 88Z"/>`
};

const EYES = {};

function silhouette(a){
  const parts = SPACE[a] || SPACE.round;
  return `<svg viewBox="0 0 240 132" aria-hidden="true"><g fill="currentColor">${parts}</g></svg>`;
}

const EMBLEM = `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" fill="currentColor" d="M8 56A42 11 0 1 0 92 56A42 11 0 1 0 8 56ZM19 56A31 5.5 0 1 1 81 56A31 5.5 0 1 1 19 56Z"/><circle cx="50" cy="48" r="24" fill="currentColor"/></svg>`;

/* ============================================================
   GAME STATE
   ============================================================ */
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const P = {A:0, B:1};
let G = null;

function newGame(mode){
  const d = shuffle(DECK.slice());
  G = {
    mode,                       // "hotseat" | "cpu"
    hands: [d.slice(0,15), d.slice(15,30)],
    pot: [],
    leader: Math.random()<.5 ? 0 : 1,
    phase: "pick",              // pick | reveal | over
    pick: null,
    result: null,
    round: 1,
    log: [], shown: null,
    names: mode==="cpu" ? ["You","Rocket AI"] : ["Player 1","Player 2"]
  };
  if(G.mode==="cpu" && G.leader===1) setTimeout(cpuPick, 700);
  render();
}

function cpuScore(card, key){
  // percentile of this card's value for this stat across the whole deck
  const vals = DECK.map(c=>c[key]).sort((x,y)=>x-y);
  const below = vals.filter(v=>v < card[key]).length;
  return below/(vals.length-1);
}
function cpuPick(){
  const card = G.hands[1][0];
  const scored = STATS.map(s=>({k:s.k, v:cpuScore(card,s.k) + Math.random()*0.06}));
  scored.sort((a,b)=>b.v-a.v);
  choose(scored[0].k);
}

function choose(key){
  if(!G || G.phase!=="pick") return;
  const a = G.hands[0][0], b = G.hands[1][0];
  const av = a[key], bv = b[key];
  const stat = STATS.find(s=>s.k===key);
  let outcome;
  if(av>bv) outcome = 0; else if(bv>av) outcome = 1; else outcome = -1;

  G.pick = key; G.phase = "reveal"; G.result = outcome; G.shown = [a,b];

  const won = [G.hands[0].shift(), G.hands[1].shift()];
  const spoils = G.pot.concat(G.leader===0 ? won : [won[1],won[0]]);
  if(outcome === -1){
    G.pot = spoils;
  }else{
    const ordered = outcome===0 ? [won[0],won[1]] : [won[1],won[0]];
    G.hands[outcome].push(...G.pot, ...ordered);
    G.pot = [];
    G.leader = outcome;
  }
  G.log.push({r:G.round, o:outcome, stat:stat.label,
              a:a.n, b:b.n, av:stat.fmt(av), bv:stat.fmt(bv), unit:stat.unit,
              potted:outcome===-1?spoils.length:0});
  render();
}

function next(){
  if(!G) return;
  G.round++;
  if(G.hands[0].length===0 || G.hands[1].length===0 || G.round>80){ G.phase="over"; render(); return; }
  G.phase="pick"; G.pick=null; G.result=null;
  render();
  if(G.mode==="cpu" && G.leader===1) setTimeout(cpuPick, 800);
}

/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");
const metaEl = document.getElementById("meta");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bareUnit = u => /^\//.test(u);

function statRows(card, side, interactive){
  return STATS.map((s,idx)=>{
    const v = card[s.k];
    let cls = "";
    if(G.phase!=="pick" && G.pick===s.k){
      cls = " picked";
      if(G.result===0) cls += side===0?" win":" lose";
      else if(G.result===1) cls += side===1?" win":" lose";
    }
    const inner = `<span class="key">${idx+1}</span>
      <span class="lab">${s.label}</span>
      <span class="val">${s.fmt(v)}<u>${s.unit}</u></span>`;
    return interactive
      ? `<li><button class="statrow${cls}" data-stat="${s.k}">${inner}</button></li>`
      : `<li><div class="statrow${cls}">${inner}</div></li>`;
  }).join("");
}

function plateHTML(card){
  const fallback = silhouette(card.a);
  const tag = esc(card.n) + (card.ai ? " · artist’s impression" : "");
  if(!card.img) return `${fallback}<span class="platetag">${tag}</span>`;
  return `${fallback}<img src="${IMG_DIR}${card.img}" alt="${esc(card.n)}" loading="lazy"
      onload="this.classList.add('loaded');this.previousElementSibling.style.display='none'"
      onerror="this.remove()">
    <span class="platetag">${tag}</span>`;
}

function cardHTML(card, side, interactive){
  const who = G.names[side];
  const res = G.phase==="reveal" && G.result===side ? " won" : "";
  return `<article class="card ${side===0?"p1":"p2"}${res}">
    <div class="card-head">
      <div class="card-owner"><b>${esc(who)}</b><span>Top card</span></div>
      <div class="card-name">${esc(card.n)}</div>
      <div class="card-sci">${esc(card.s)}</div>
      <div class="chips">
        <span class="chip kind kind-${card.c}">${esc(card.k)}</span>
        <span class="chip">Orbits ${esc(card.o)}</span>
      </div>
    </div>
    <div class="plate">${plateHTML(card)}${res ? `<span class="ribbon">Winner</span>` : ""}</div>
    <ul class="stats">${statRows(card, side, interactive)}</ul>
  </article>`;
}

function backHTML(side){
  return `<article class="card back ${side===0?"p1":"p2"}">
    <div class="backfill">
      <div class="emblem">${EMBLEM}</div>
      <div class="bt">${esc(G.names[side])}</div>
      <div class="bs">Face down</div>
    </div>
  </article>`;
}

function railHTML(side){
  const n = G.hands[side].length;
  const ticks = Array.from({length:30},(_,i)=>`<span class="tick${i<n?" on":""}"></span>`).join("");
  const active = G.phase==="pick" && G.leader===side;
  return `<aside class="rail ${side===0?"p1":"p2"}${active?" active":""}">
    <div class="who">${side===0?"Inner orbit":"Outer orbit"}</div>
    <div class="nm">${esc(G.names[side])}</div>
    <div class="count">${String(n).padStart(2,"0")}</div>
    <div class="cl">cards held</div>
    <div class="stack">${ticks}</div>
    <div class="turnflag">${active?"▸ Calling the stat":"Waiting"}</div>
  </aside>`;
}

function logHTML(){
  if(!G.log.length) return "";
  return `<section class="log"><h3>Round log</h3><ol>${G.log.map(e=>{
    const cls = e.o===0?"a":e.o===1?"b":"d";
    const label = e.o===-1 ? "Draw" : G.names[e.o];
    const tail = e.o===-1 ? ` — ${e.potted} card${e.potted===1?"":"s"} to the pot` : "";
    return `<li><span class="r">R${e.r}</span>
      <span>${esc(e.stat)}: <em>${esc(e.a)}</em> ${e.av}${bareUnit(e.unit)?"":" "+e.unit} vs <em>${esc(e.b)}</em> ${e.bv}${bareUnit(e.unit)?"":" "+e.unit}${tail}</span>
      <span class="o ${cls}">${esc(label)}</span></li>`;
  }).join("")}</ol></section>`;
}

function promptHTML(){
  if(G.phase==="pick"){
    const l = G.leader;
    const cpuTurn = G.mode==="cpu" && l===1;
    return `<div class="prompt ${l===1?"teal":""}">
      <div>
        <div class="msg"><b class="${l===1?"t":""}">${esc(G.names[l])}</b> ${cpuTurn?"is choosing a stat…":"— call your strongest stat"}</div>
        <div class="hint">${cpuTurn?"The AI ranks its world against the whole deck.":"Click a stat on your card, or press 1–6. Highest value wins both cards."}</div>
      </div>
      ${G.pot.length?`<div class="pot">Pot: ${G.pot.length} cards</div>`:""}
    </div>`;
  }
  const stat = STATS.find(s=>s.k===G.pick);
  let cls, msg;
  if(G.result===-1){ cls="draw"; msg=`Dead heat on ${stat.label} — ${G.pot.length} cards to the pot`; }
  else { cls = G.result===0?"win":"lose"; msg = `<b class="${G.result===1?"t":""}">${esc(G.names[G.result])}</b> takes it on ${stat.label}`; }
  return `<div class="prompt ${cls}">
    <div><div class="msg">${msg}</div>
    <div class="hint">${G.result===-1?"Both cards ride on the next round.":"Winner leads the next round."}</div></div>
    <button class="btn nextBtn">Next round →</button>
  </div>`;
}

function menu(){
  metaEl.innerHTML = "";
  const rows = STATS.map(s=>{
    const hi = DECK.reduce((a,b)=>b[s.k]>a[s.k]?b:a);
    return `<div class="legend-row"><span>${s.label}</span><span>max ${s.fmt(hi[s.k])} ${s.unit} · ${hi.n}</span></div>`;
  }).join("");
  app.innerHTML = `
  <div class="menu">
    <div>
      <h2 class="menu-lede">Thirty worlds. Six numbers each. One of you takes the whole Solar System.</h2>
      <p>Every card is a real place in the Solar System, from the 500&nbsp;m asteroid Bennu to Jupiter, which is wider than eleven Earths side by side. The deck is split down the middle and dealt face down. You only ever see your own top card.</p>
      <ol class="rules">
        <li><span class="n">01</span><span><b>Call a stat.</b> Whoever leads picks one of the six numbers on their top card.</span></li>
        <li><span class="n">02</span><span><b>Both cards flip.</b> Higher number always wins — so on Temperature, boiling Venus beats icy Pluto.</span></li>
        <li><span class="n">03</span><span><b>Winner takes both</b> to the bottom of their pile and leads the next round.</span></li>
        <li><span class="n">04</span><span><b>A tie feeds the pot.</b> Tied cards sit out; the next winner sweeps them up.</span></li>
        <li><span class="n">05</span><span><b>Take all 30 cards to win.</b> If nobody has by round 80, the bigger pile takes it.</span></li>
      </ol>
      <div class="legend">
        <h3>The six stats · deck leaders</h3>
        <div class="legend-grid">${rows}</div>
      </div>
    </div>
    <div>
      <div class="modes">
        <button class="mode" data-mode="hotseat">
          <span class="go">Deal →</span>
          <div class="t">Pass and play</div>
          <div class="d">Two people, one screen. Hand it over when the lead changes — each card is only ever shown to the player holding it.</div>
        </button>
        <button class="mode" data-mode="cpu">
          <span class="go">Deal →</span>
          <div class="t">You vs Rocket AI</div>
          <div class="d">The computer ranks its world against all 30 cards and calls whichever stat sits highest in the deck.</div>
        </button>
      </div>
      <div class="legend">
        <h3>Sources &amp; caveats</h3>
        <div class="legend-row"><span>Diameter</span><span>across the equator</span></div>
        <div class="legend-row"><span>Gravity</span><span>percentage of Earth’s pull</span></div>
        <div class="legend-row"><span>Day length</span><span>one full spin, in Earth hours</span></div>
        <div class="legend-row"><span>Distance</span><span>average, from the Sun</span></div>
        <p style="font-size:12.5px;margin-top:12px">Figures come from NASA fact sheets, rounded to play well. Moon counts are for 2026 and keep climbing — Saturn has gained well over a hundred since 2023. A moon takes its planet’s distance from the Sun, so Io and Jupiter tie on that stat. Eris, Haumea and Makemake have never been visited and their cards show an artist’s impression; every other card is a real photograph. Pictures come from Wikimedia Commons under free licences and are credited in <code>images/space/CREDITS.md</code>.</p>
      </div>
    </div>
  </div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>newGame(b.dataset.mode));
}

function render(){
  if(!G){ menu(); return; }
  metaEl.innerHTML = `
    <div class="meta-cell"><div class="k">Round</div><div class="v">${String(G.round).padStart(2,"0")}</div></div>
    <div class="meta-cell"><div class="k">Pot</div><div class="v">${String(G.pot.length).padStart(2,"0")}</div></div>
    <div class="meta-cell"><div class="k">Mode</div><div class="v" style="font-size:13px">${G.mode==="cpu"?"vs AI":"2P"}</div></div>`;

  if(G.phase==="over"){
    const w = G.hands[0].length > G.hands[1].length ? 0 : G.hands[1].length > G.hands[0].length ? 1 : -1;
    app.innerHTML = `<div class="over">
      <div class="crest">${EMBLEM}</div>
      <h2>${w===-1?"Stalemate":esc(G.names[w])+" takes the deck"}</h2>
      <p>${w===-1?"Eighty rounds, dead level.":`Final count ${G.hands[0].length} – ${G.hands[1].length} after ${G.round-1} rounds.`}</p>
      <div class="actions">
        <button class="btn" id="again">Deal again</button>
        <button class="btn ghost" id="back">Back to menu</button>
      </div>
    </div>${logHTML()}`;
    document.getElementById("again").onclick=()=>newGame(G.mode);
    document.getElementById("back").onclick=()=>{G=null;render();};
    return;
  }

  const l = G.leader;
  const showBoth = G.phase!=="pick";
  const face = side => showBoth ? G.shown[side] : G.hands[side][0];
  const leftCard  = (showBoth || l===0) ? cardHTML(face(0),0, G.phase==="pick" && l===0) : backHTML(0);
  const rightCard = (showBoth || l===1) ? cardHTML(face(1),1, G.phase==="pick" && l===1 && G.mode!=="cpu") : backHTML(1);
  const prompt = promptHTML();

  app.innerHTML = `<div class="table">
    <div class="railcol">${railHTML(0)}${prompt}</div>
    <div class="arena">${leftCard}${rightCard}</div>
    <div class="railcol">${railHTML(1)}${prompt}</div>
  </div>
  ${logHTML()}`;

  app.querySelectorAll("button.statrow").forEach(b=>b.onclick=()=>choose(b.dataset.stat));
  app.querySelectorAll("button.nextBtn").forEach(b=>b.onclick=next);
}

document.addEventListener("keydown", e=>{
  if(!G) return;
  if(G.phase==="reveal" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); next(); return; }
  if(G.phase!=="pick") return;
  if(G.mode==="cpu" && G.leader===1) return;
  const i = parseInt(e.key,10);
  if(i>=1 && i<=6) choose(STATS[i-1].k);
});

render();
</script>
